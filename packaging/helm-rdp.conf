# Helm Remote Desktop - master configuration.
# Each user can override any key in ~/.config/helm-rdp/helm-rdp.conf
# (same format). Never put passwords in this file.

[helm-rdp]
# FreeRDP client used for sessions: auto (xfreerdp3, xfreerdp, sdl-freerdp3,
# wlfreerdp) or a full path. Rocky 9 ships FreeRDP 2.11, Rocky 10 FreeRDP 3.
freerdp = auto

# Extra FreeRDP options added to every connection, e.g.
#   extra_args = /gdi:hw +home-drive
# /p:, /gp:, /from-stdin and /args-from are ignored here.
extra_args =

# FreeRDP log level. Helm needs INFO to see when the session is up.
log_level = INFO

# Seconds to wait for the computer when checking its certificate.
connect_timeout = 15
